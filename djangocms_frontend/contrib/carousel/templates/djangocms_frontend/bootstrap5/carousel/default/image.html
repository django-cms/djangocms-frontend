{% load cms_tags %}
{% if instance.image_asset %}
    <img class="d-block mx-auto" style="height: 40vh;" src="{{ instance.img_src }}" alt="{{ instance.image_alt_text }}" />
    {% include "djangocms_frontend/bootstrap5/image_attribution.html" with attribution=instance.image_attribution only %}
{% else %}
    <div class="d-block w-100"
        style="aspect-ratio: {{ aspect_ratio }}">
        {% for plugin in instance.child_plugin_instances %}
            {% render_plugin plugin %}
        {% endfor %}
    </div>
{% endif %}
